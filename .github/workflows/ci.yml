# The four-step gate, run by GitHub on every push that could reach an integration.
#
# Why this exists (2026-09-02, the parallel-tracks operating model): the gate
# (`pnpm typecheck && lint && test && build`) was a local ritual, so a track's
# breakage only surfaced inside the Orchestrator's integration window, on a tree
# that already mixed several branches. Running it per push turns an agent's own
# branch red BEFORE the merge, which is the prerequisite for wider fan-out.
#
# The toolchain is pinned to the one CLAUDE.md pins: Node from `.nvmrc`, pnpm
# 9.14.4, `--frozen-lockfile` (so a lockfile that drifted from package.json fails
# here rather than resolving to something nobody has installed).
#
# Each command is its OWN step so a failure names itself in the Actions UI: the
# red step title is the answer, no log spelunking. Steps stop at the first
# failure, on purpose (a broken typecheck usually explains the rest).
#
# BUILD ENV. `src/lib/env.ts` validates the public schema EAGERLY at import, so
# `next build` dies collecting page data without these two (measured with an
# empty environment, 2026-09-02):
#   NEXT_PUBLIC_SUPABASE_URL              a valid URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  a non-empty string
# Both are public by design (Next inlines them into the client bundle), so they
# belong in repository VARIABLES, never secrets, and never hard-coded here:
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable.
# Nothing else is needed. Every other var in env.ts is `.optional()` with a lazy
# assert, and the build performs no network calls (it built green on placeholder
# values). typecheck, lint and test need NO environment at all (also measured),
# which is why they run unconditionally and the guard only gates the build.
#
# Until those two variables exist, the build step SKIPS with a loud annotation
# rather than failing: a red run must mean broken code, not unfinished setup, or
# the signal is worthless on day one. Set them and it lights up on the next push.
#
# THE BUDGET (the CI budget round, 2026-09-15). Round four of the review wave ran
# twelve agent tracks at once and every one of their pushes ran this gate: 405
# runs and about 1,500 runner-minutes on 09-14 and 09-15 alone, 90 percent of
# them on lp/* branches, which spent the month's private-repo budget in two days
# (Will: "every single commit does not need a full CI/CD deployment, especially
# when it's UI heavy with minimal risk"). Every agent already runs the four-step
# gate locally before a handoff and the Orchestrator reruns it on the merged
# tree, so the remote run on an agent branch was a second opinion, not the
# gate. The policy now:
#   - main and launch-prep run on every push that touches code; a push that only
#     changes docs is skipped (paths-ignore), and the Orchestrator's record
#     commits say [skip ci] besides.
#   - lp/** pushes run ONLY when the head commit message carries [ci]: an agent
#     opts a push in (a production sweep, a lockfile change, a tree it cannot
#     build locally). Otherwise the job is skipped at zero minutes.
#   - pull requests to main always run; workflow_dispatch always runs.

name: ci

on:
  push:
    branches:
      # main is included because milestone merges land on it by a direct push,
      # never through a pull request (the track's own deferred note, 2026-09-02).
      - main
      - launch-prep
      - "lp/**"
    # A docs-only push never changes what the gate checks (the manifests' lane
    # guard is run locally before every integration push).
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

# A newer push to the same ref supersedes the older run: only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    # An agent branch runs the remote gate only on request ([ci] in the head
    # commit message); a skipped job bills nothing. Everything else runs.
    if: >-
      ${{ github.event_name != 'push'
          || !startsWith(github.ref, 'refs/heads/lp/')
          || contains(github.event.head_commit.message, '[ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm BEFORE node: `cache: true` caches the pnpm store keyed on
      # pnpm-lock.yaml, so a clean tree reinstalls from the store, not the
      # network. package.json has no `packageManager` field, so the version is
      # named here and must track CLAUDE.md's pin.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.4
          cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: Guard - the build needs two public repository variables
        id: buildenv
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pnpm build skipped::Set the repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions > Variables) to run the build step. typecheck, lint and test still gate every push."
          fi

      - name: pnpm build
        if: steps.buildenv.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build
