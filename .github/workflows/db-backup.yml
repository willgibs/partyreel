# Off-site logical Postgres backup — media-durability Pillar C (ADR-0013).
#
# Daily `supabase db dump` (schema + data of the app's schema) -> tar.gz -> the immutable R2 backup
# bucket `partyreel-backup` under `db/`, via rclone (the Cloudflare-documented R2 tool; avoids the
# AWS-SDK CRC-checksum gotcha that silently corrupts R2 uploads — see ADR-0003). This SUPPLEMENTS
# Supabase Pro's daily backups (7-day, same-vendor) with an OFF-SITE, longer-retention copy that
# survives a Supabase-account loss. The objects backup (Pillar B) is useless without these rows.
#
# REQUIRED GitHub repo secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SUPABASE_DB_URL              direct/session Postgres connection string (port 5432 — NOT the 6543
#                                transaction pooler; pg_dump needs a session connection). From the
#                                Supabase dashboard: Project Settings -> Database -> Connection string.
#   R2_BACKUP_ACCESS_KEY_ID      an R2 API token scoped to WRITE the partyreel-backup bucket
#   R2_BACKUP_SECRET_ACCESS_KEY  (do NOT reuse the app's partyreel-only Object token)
# The R2 account id / S3 endpoint is non-secret config (already in CLAUDE.md), set in `env` below.
#
# OPTIONAL, for the /admin/jobs kill switch + heartbeat (admin-portal P8, QA #15):
#   PRUNE_API_SECRET             the shared internal-jobs bearer (the SAME value as the Vercel env
#                                var and the backup Worker's secret). Without it this workflow runs
#                                exactly as before, just unlogged: the heartbeat steps skip cleanly.
# JOB_API_URL is non-secret config, hardcoded in `env` below the way wrangler.jsonc hardcodes the
# sibling prune endpoint. The gate FAILS OPEN on an unreachable app: a backup that runs without a
# heartbeat is only a blind spot, a backup that does not run is a durability risk. The one thing it
# does obey is an explicit pause from /admin/jobs.
#
# Until the secrets exist, every step SKIPS cleanly (no failed-run emails). To enable + verify:
#   1) add the 3 secrets, 2) Actions tab -> "db-backup" -> Run workflow, 3) confirm a db/ object
#   landed (`wrangler r2 object get partyreel-backup/db/<file>`), 4) test-restore it into a throwaway
#   DB before trusting it (an unrestorable dump is worthless).

name: db-backup

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC (after the app's 04:00 purge + 05:00 backup-reconcile crons)
  workflow_dispatch: {} # manual runs (for the enable + verification check)

# One backup at a time; never pile up overlapping runs.
concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret config: the P3 R2 account's S3 endpoint + the backup bucket.
      R2_ENDPOINT: https://8bd90d2f6a374d6cdff2f379e929b060.r2.cloudflarestorage.com
      R2_BUCKET: partyreel-backup
      # The app's job heartbeat endpoint (sibling of the Worker's backup-prune confirm URL).
      JOB_API_URL: https://partyreel.com/api/internal/job-run
      # Opt JS actions (supabase/setup-cli@v1) into Node 24 ahead of GitHub's 2026-06-16 forced
      # cutover (Node 20 is deprecated). Verified working on a manual run before this landed.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Guard — skip cleanly until secrets are configured
        id: guard
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$R2_KEY" ]; then
            echo "Secrets not set yet — skipping. Configure SUPABASE_DB_URL + R2_BACKUP_* to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The kill switch + heartbeat start. Three outcomes, and only ONE of them stops the backup:
      #   paused=true  -> an operator switched this job off on /admin/jobs. The app has already
      #                   logged the skipped run, so we stop here and the job still reports in.
      #   run_id set   -> the heartbeat is open; the finish step below closes it.
      #   anything else (no secret, app down, bad response) -> run anyway, unlogged. Not backing up
      #                   is the bigger risk, and the app's daily freshness scan notices the silence.
      - name: Job gate — kill switch and heartbeat
        id: job
        if: steps.guard.outputs.ready == 'true'
        env:
          JOB_SECRET: ${{ secrets.PRUNE_API_SECRET }}
          TRIGGERED_BY: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}
        run: |
          set -uo pipefail
          echo "paused=false" >> "$GITHUB_OUTPUT"
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "started_at_ms=" >> "$GITHUB_OUTPUT"
          if [ -z "${JOB_SECRET:-}" ]; then
            echo "PRUNE_API_SECRET not set — running without a heartbeat."
            exit 0
          fi
          # --fail-with-body would swallow the payload on a 4xx; we only ever read the 2xx body.
          RESP="$(curl -sS -m 20 -X POST "$JOB_API_URL" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $JOB_SECRET" \
            -d "{\"phase\":\"start\",\"job\":\"db_backup\",\"triggeredBy\":\"$TRIGGERED_BY\"}" || true)"
          if [ -z "$RESP" ]; then
            echo "::warning::Job heartbeat unreachable — running unlogged."
            exit 0
          fi
          PAUSED="$(echo "$RESP" | jq -r '.paused // false')"
          if [ "$PAUSED" = "true" ]; then
            echo "::notice::db_backup is paused on /admin/jobs — skipping this run."
            echo "paused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$(echo "$RESP" | jq -r '.runId // empty')" >> "$GITHUB_OUTPUT"
          echo "started_at_ms=$(echo "$RESP" | jq -r '.startedAtMs // empty')" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        if: steps.guard.outputs.ready == 'true' && steps.job.outputs.paused != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install rclone
        if: steps.guard.outputs.ready == 'true' && steps.job.outputs.paused != 'true'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Dump schema + data
        if: steps.guard.outputs.ready == 'true' && steps.job.outputs.paused != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Supabase-aware dump (bundles a PG17-compatible pg_dump; scopes to the app schema).
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f data.sql
          # Fail fast if the dump is empty or missing our core data (the real gate is a test-restore).
          test -s schema.sql && test -s data.sql
          grep -q "media" schema.sql || { echo "schema.sql missing the media table — aborting"; exit 1; }
          tar -czf "pr-db-$STAMP.tar.gz" schema.sql data.sql
          ls -l "pr-db-$STAMP.tar.gz"

      - name: Upload to R2 (rclone)
        if: steps.guard.outputs.ready == 'true' && steps.job.outputs.paused != 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          KEY="db/pr-db-$STAMP.tar.gz"
          # rclone (apt 1.60.1) may log a transient "501 NotImplemented" on attempt 1 and succeed on
          # retry — that is an R2-side blip, not a failure (the object lands). --s3-no-check-bucket skips
          # a bucket HEAD that the lock/IA config can 501 on. The verify step below is the real gate.
          rclone copyto "pr-db-$STAMP.tar.gz" "R2:$R2_BUCKET/$KEY" --s3-no-check-bucket
          # Zero-silent-failure guard: a green rclone exit is necessary but NOT sufficient — independently
          # confirm the object EXISTS in R2 at the exact local byte size, else fail the run loudly.
          LOCAL_BYTES=$(stat -c%s "pr-db-$STAMP.tar.gz")
          REMOTE_BYTES=$(rclone size "R2:$R2_BUCKET/$KEY" --s3-no-check-bucket --json 2>/dev/null | grep -oE '"bytes":[0-9]+' | grep -oE '[0-9]+' || true)
          echo "verify: local=$LOCAL_BYTES remote=${REMOTE_BYTES:-MISSING}"
          if [ "${REMOTE_BYTES:-0}" != "$LOCAL_BYTES" ]; then
            echo "::error::Backup verification FAILED — $KEY missing or size-mismatched in $R2_BUCKET (local=$LOCAL_BYTES remote=${REMOTE_BYTES:-MISSING})"
            exit 1
          fi
          echo "Verified $KEY in $R2_BUCKET ($REMOTE_BYTES bytes, IA + 35-day lock)."
          # Carried into the heartbeat so /admin/jobs shows the dump SIZE, not just a green tick: a
          # backup that suddenly halves is the interesting failure, and only a number surfaces it.
          echo "BACKUP_BYTES=$LOCAL_BYTES" >> "$GITHUB_ENV"

      # Closes the heartbeat row whatever happened above (`always()`), so a failed dump shows as a
      # FAILED run on /admin/jobs rather than as a silence indistinguishable from a job that stopped
      # firing. Skipped entirely when no row was opened (no secret, or the app was unreachable).
      - name: Job heartbeat — finish
        if: always() && steps.job.outputs.run_id != ''
        env:
          JOB_SECRET: ${{ secrets.PRUNE_API_SECRET }}
          RUN_ID: ${{ steps.job.outputs.run_id }}
          STARTED_AT_MS: ${{ steps.job.outputs.started_at_ms }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          if [ -z "${STARTED_AT_MS:-}" ]; then
            echo "::warning::No heartbeat start timestamp; leaving the run open."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then STATUS=ok; else STATUS=error; fi
          BYTES="${BACKUP_BYTES:-0}"
          NOTE="GitHub Actions run ${GITHUB_RUN_ID} (${JOB_STATUS})"
          curl -sS -m 20 -o /dev/null -X POST "$JOB_API_URL" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $JOB_SECRET" \
            -d "{\"phase\":\"finish\",\"job\":\"db_backup\",\"runId\":\"$RUN_ID\",\"startedAtMs\":$STARTED_AT_MS,\"status\":\"$STATUS\",\"counts\":{\"dump_bytes\":$BYTES},\"note\":\"$NOTE\"}" \
            || echo "::warning::Could not close the job heartbeat (the backup result above stands)."
