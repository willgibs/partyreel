<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Usher">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6ae2"/>
      <stop offset="1" stop-color="#1d5e7c"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dad0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f1dad0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f1dad0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="196"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#g)"/>
  <g clip-path="url(#disc)">
    <!-- the aisle: one lit seam along the diagonal, the usher's torch beam -->
    <rect x="-60" y="186" width="520" height="28" fill="url(#seam)" transform="rotate(-45 200 200)"/>
    <rect x="-60" y="197" width="520" height="6" fill="#f1dad0" opacity="0.9" transform="rotate(-45 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="194" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>